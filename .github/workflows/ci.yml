name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Type-check, test, and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build .xpi
        run: npm run build
      - name: Add-on linter
        run: npx addons-linter dist/thundervim
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: thundervim-xpi
          path: dist/*.xpi
          if-no-files-found: error
